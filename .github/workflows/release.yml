name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate version
        id: version
        run: echo "version=$(date -u +'%Y.%m.%d.%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog

      - name: Generate changelog
        id: changelog
        run: |
          # Find the previous tag (if any)
          PREV_TAG=$(git tag --sort=-creatordate | head -1)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "Generating changelog from ${PREV_TAG} to HEAD"
          else
            RANGE=""
            echo "Generating changelog from all commits (first release)"
          fi

          # Collect commits by category
          FEATURES=""
          FIXES=""
          OTHER=""

          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -d' ' -f1)
            MSG=$(echo "$line" | cut -d' ' -f2-)

            case "$MSG" in
              feat:*|feat\(*) FEATURES="${FEATURES}
          - ${MSG#feat: }" ;;
              fix:*|fix\(*)   FIXES="${FIXES}
          - ${MSG#fix: }" ;;
              build:*|doc:*|docs:*|chore:*) OTHER="${OTHER}
          - ${MSG}" ;;
              *)              OTHER="${OTHER}
          - ${MSG}" ;;
            esac
          done < <(git log ${RANGE} --oneline --no-merges)

          # Build changelog body
          BODY=""
          if [ -n "$FEATURES" ]; then
            BODY="${BODY}## Features
          ${FEATURES}

          "
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}## Fixes
          ${FIXES}

          "
          fi
          if [ -n "$OTHER" ]; then
            BODY="${BODY}## Other
          ${OTHER}

          "
          fi

          if [ -n "$PREV_TAG" ]; then
            BODY="${BODY}**Full changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.version.outputs.version }}"
          fi

          # Write to file (multiline output)
          echo "$BODY" > /tmp/changelog.md
          echo "Generated changelog:"
          cat /tmp/changelog.md

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate templates
        run: templ generate

      - name: Download Tailwind CSS
        run: |
          curl -sLO "https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64"
          chmod +x tailwindcss-linux-x64
          sudo mv tailwindcss-linux-x64 /usr/local/bin/tailwindcss

      - name: Build CSS
        run: tailwindcss -i static/css/input.css -o static/css/output.css --minify

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o "dist/libreregistration-linux-${arch}/server" ./cmd/server
            cp -r static "dist/libreregistration-linux-${arch}/static"
            tar -czf "dist/libreregistration-linux-${arch}.tar.gz" -C dist "libreregistration-linux-${arch}"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: /tmp/changelog.md
          files: |
            dist/libreregistration-linux-amd64.tar.gz
            dist/libreregistration-linux-arm64.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
